{{ partial "header.html" . }}

<div class="container">
    <article class="post-container">
        <header class="post-header post-header-line"></header>
        {{ range .Sites }}
            <div class="post-content" lang="{{ .Language.Lang }}" itemscope="" itemtype="https://schema.org/Person">
                {{ .Home.Content }}
            </div>
        {{ end }}
    </article>
</div>

{{ partial "footer.html" . }}
